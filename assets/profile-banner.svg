<svg
xmlns="http://www.w3.org/2000/svg"
width="1200"
height="340"
viewBox="0 0 1200 340">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#04080f"/>
<stop offset="45%" stop-color="#091727"/>
<stop offset="100%" stop-color="#142b49"/>
</linearGradient>

<linearGradient id="accent" x1="0" x2="1">
<stop offset="0%" stop-color="#58a6ff"/>
<stop offset="50%" stop-color="#8b5cf6"/>
<stop offset="100%" stop-color="#22d3ee"/>
</linearGradient>

<radialGradient id="glow1">
<stop offset="0%" stop-color="#58a6ff" stop-opacity=".30"/>
<stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
</radialGradient>

<radialGradient id="glow2">
<stop offset="0%" stop-color="#8b5cf6" stop-opacity=".20"/>
<stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
</radialGradient>

<pattern
id="grid"
width="36"
height="36"
patternUnits="userSpaceOnUse">

<path
d="M 36 0 L 0 0 0 36"
fill="none"
stroke="#ffffff"
stroke-opacity=".035"/>

</pattern>

<filter id="shadow">

<feGaussianBlur stdDeviation="8"/>

</filter>

</defs>


<!-- Background -->

<rect
width="1200"
height="340"
rx="24"
fill="url(#bg)"/>

<rect
width="1200"
height="340"
rx="24"
fill="url(#grid)"/>


<!-- Ambient lights -->

<circle cx="1100" cy="20" r="300" fill="url(#glow1)"/>

<circle cx="900" cy="340" r="280" fill="url(#glow2)"/>


<!-- Decorative circuit -->

<g
fill="none"
stroke="url(#accent)"
stroke-width="2"
opacity=".32">

<path d="M760 52 H920 V85 H1130"/>
<path d="M790 96 H870 V130 H1050"/>
<path d="M740 145 H840 V185 H990"/>
<path d="M870 225 H1130"/>
<path d="M980 270 H1160"/>

</g>


<g fill="#58a6ff">

<circle cx="760" cy="52" r="4"/>
<circle cx="1130" cy="85" r="4"/>
<circle cx="790" cy="96" r="4"/>
<circle cx="1050" cy="130" r="4"/>
<circle cx="740" cy="145" r="4"/>

</g>


<!-- Terminal decoration -->

<g transform="translate(845 165)">

<rect
width="285"
height="125"
rx="14"
fill="#050b13"
fill-opacity=".75"
stroke="#ffffff"
stroke-opacity=".13"/>

<circle cx="20" cy="20" r="5" fill="#ff5f57"/>
<circle cx="38" cy="20" r="5" fill="#febc2e"/>
<circle cx="56" cy="20" r="5" fill="#28c840"/>

<text
x="20"
y="57"
font-family="monospace"
font-size="14"
fill="#58a6ff">
$ whoami
</text>

<text
x="20"
y="80"
font-family="monospace"
font-size="15"
fill="#ffffff">
AI Engineer in progress
</text>

<text
x="20"
y="105"
font-family="monospace"
font-size="13"
fill="#8ba5c3">
python • java • linux
</text>

</g>


<!-- Header text -->

<text
x="68"
y="78"
font-family="monospace"
font-size="17"
letter-spacing="5"
fill="#7695b9">
SYSTEM.USER
</text>


<text
x="65"
y="167"
font-family="Arial, sans-serif"
font-weight="900"
font-size="78"
letter-spacing="3"
fill="#ffffff">
DUC ANH
</text>


<rect
x="68"
y="192"
width="485"
height="5"
rx="3"
fill="url(#accent)"/>


<text
x="68"
y="240"
font-family="Arial, sans-serif"
font-size="24"
fill="#d9e7f7">
Artificial Intelligence × Software Engineering
</text>


<text
x="68"
y="281"
font-family="monospace"
font-size="16"
letter-spacing="2"
fill="#8da7c4">
AI  •  COMPUTER VISION  •  BACKEND  •  LINUX
</text>


<text
x="68"
y="310"
font-family="monospace"
font-size="13"
fill="#56708d">
github.com/Ducanhngo
</text>

</svg>
