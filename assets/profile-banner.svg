<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Duc Anh GitHub Profile Banner">

  <defs>

    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b14"></stop>
      <stop offset="45%" stop-color="#0d1b30"></stop>
      <stop offset="100%" stop-color="#183458"></stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"></stop>
      <stop offset="45%" stop-color="#7c6cff"></stop>
      <stop offset="100%" stop-color="#2dd4bf"></stop>
    </linearGradient>

    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity=".28"></stop>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".25"></stop>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"></stop>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"></path>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

  </defs>

  <!-- background -->

  <rect width="1200" height="320" rx="26" fill="url(#background)"></rect>

  <rect width="1200" height="320" rx="26" fill="url(#grid)"></rect>

  <!-- glow -->

  <circle cx="1030" cy="50" r="240" fill="url(#blueGlow)"></circle>

  <circle cx="1120" cy="300" r="250" fill="url(#purpleGlow)"></circle>

  <!-- circuits -->

  <g stroke="url(#accent)" stroke-width="2" opacity=".45" fill="none">

    <path d="M760 55 H970 Q990 55 990 75 V100 H1110"></path>
    <path d="M800 105 H900 Q920 105 920 125 V145 H1070"></path>
    <path d="M750 150 H845 Q865 150 865 170 V200 H1030"></path>
    <path d="M970 205 H1135"></path>
    <path d="M1010 245 H1160"></path>

  </g>

  <g fill="#58a6ff">

    <circle cx="760" cy="55" r="5"></circle>
    <circle cx="1110" cy="100" r="5"></circle>
    <circle cx="800" cy="105" r="5"></circle>
    <circle cx="1070" cy="145" r="5"></circle>
    <circle cx="750" cy="150" r="5"></circle>

  </g>

  <!-- subtitle -->

  <text x="70" y="83" fill="#8da9ca" font-family="monospace" font-size="20" letter-spacing="5">
    HELLO, I'M
  </text>

  <!-- name -->

  <text x="67" y="164" fill="#ffffff" font-family="Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="3">
    DUC ANH
  </text>

  <!-- gradient underline -->

  <rect x="70" y="190" width="485" height="5" rx="3" fill="url(#accent)" filter="url(#glow)"></rect>

  <!-- career -->

  <text x="70" y="238" fill="#d7e5f7" font-family="Arial, sans-serif" font-size="25">
    Computer Science • AI / ML • Backend Engineering
  </text>

  <text x="70" y="278" fill="#8ba5c3" font-family="monospace" font-size="18" letter-spacing="2">
    BUILD  •  LEARN  •  CREATE
  </text>

  <!-- right side card -->

  <g transform="translate(880 160)">

    <rect width="255" height="115" rx="17" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".15"></rect>

    <text x="22" y="31" fill="#58a6ff" font-family="monospace" font-size="14">
      CURRENT_FOCUS
    </text>

    <text x="22" y="61" fill="#ffffff" font-family="monospace" font-size="17">
      AI • CV • NLP
    </text>

    <text x="22" y="87" fill="#ffffff" font-family="monospace" font-size="17">
      JAVA • SPRING
    </text>

  </g>

</svg>
